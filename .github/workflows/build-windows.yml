name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: pyinstaller --noconsole --onefile --name BLACKTRACE main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BLACKTRACE-Windows
          path: dist/BLACKTRACE.exe
